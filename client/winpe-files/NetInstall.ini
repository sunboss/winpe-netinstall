; ============================================================
; WinPE 网络安装 - 优盘配置文件
; 位置：优盘根目录（与 bootmgr 同级）
; 改完直接生效，无需重建优盘
; 优先级：本文件 > server.txt（构建时写入）> 开机手动输入
; ============================================================

[Server]
; 服务端地址，格式 IP:端口 或 域名:端口（http:// 前缀可省略）
; 留空则回退到 server.txt，server.txt 也没有则开机手动输入
Url=192.168.1.10:8080

[Boot]
; 开机菜单等待秒数（startnet.cmd 显示菜单后）
; 0 = 不等待，直接执行默认选项
MenuTimeout=10
; 默认选项：1=网络安装 2=WinPE命令行 3=重启 4=关机
DefaultChoice=1

[Install]
; 安装程序默认安装模式：0=每次询问 1=整盘清空 2=保留分区
DefaultMode=0
