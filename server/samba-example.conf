# Samba 共享配置示例（Linux 服务端）
# 用途：让 WinPE 客户端通过 SMB 直读 .wim 安装，无需把整个镜像下载到本地
# 安装：sudo cp samba-example.conf /etc/samba/smb.conf（或 include），sudo systemctl restart smbd
#
# 注意：SMB 直读要求服务端与客户端在同一局域网（或打通的三层网络），
# 且 WinPE 能解析/访问该地址。如需跨互联网，请改用 protocol=http 方式。

[global]
   workgroup = WORKGROUP
   server min protocol = SMB2
   map to guest = Bad User

[images]
   comment = WinPE 网络安装镜像库
   path = /srv/netinstall/images
   read only = yes
   guest ok = yes
   browsable = yes
